name: Deploy to Plesk

# Runs automatically on every push to main — i.e. every time the site is updated.
on:
  push:
    branches: [ main ]
  workflow_dispatch:   # allows a manual "Run workflow" button in GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site files
        uses: actions/checkout@v4

      - name: Stage clean upload folder (exclude git/workflow/readme)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            ./ _site/
          echo "Files staged for upload:"; find _site -type f | wc -l

      - name: Deploy to Plesk via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server:      ${{ secrets.FTP_HOST }}
          username:    ${{ secrets.FTP_USERNAME }}
          password:    ${{ secrets.FTP_PASSWORD }}
          port:        22
          local_path:  './_site/*'
          remote_path: '/httpdocs'
          sftp_only:   true
